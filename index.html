<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Mini LDR Studio V2</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#111;
color:#fff;
font-family:Arial,sans-serif;
text-align:center;
}

main{
max-width:900px;
margin:auto;
padding:12px;
}

h1{
font-size:23px;
margin:8px 0;
}

p{
margin:6px;
color:#ccc;
}

button{
border:0;
border-radius:9px;
padding:12px 16px;
margin:5px;
background:#e53935;
color:white;
font-weight:bold;
font-size:14px;
}

button:active{
transform:scale(.96);
}

input{
width:150px;
padding:12px;
border:0;
border-radius:9px;
font-size:16px;
text-align:center;
text-transform:uppercase;
}

#status{
margin:12px 0;
color:#8cff8c;
font-size:14px;
}

#roomInfo{
margin:10px;
font-size:17px;
}

.hidden{
display:none!important;
}

/* DUA KAMERA SELALU BERDAMPINGAN */

.cameras{
display:grid;
grid-template-columns:1fr 1fr;
gap:7px;
width:100%;
}

.camera{
position:relative;
width:100%;
aspect-ratio:9/16;
background:#222;
border-radius:10px;
overflow:hidden;
}

.camera video{
width:100%;
height:100%;
object-fit:cover;
}

.label{
position:absolute;
top:7px;
left:7px;
background:#000c;
padding:5px 8px;
border-radius:6px;
font-size:12px;
}

#hasil{
display:block;
width:100%;
max-width:540px;
margin:15px auto;
border-radius:10px;
}

#download{
display:inline-block;
background:#16a34a;
color:white;
padding:12px 18px;
border-radius:9px;
text-decoration:none;
font-weight:bold;
}

#countdown{
position:fixed;
inset:0;
background:#000c;
z-index:999;
display:flex;
align-items:center;
justify-content:center;
font-size:100px;
font-weight:bold;
}

#copyRoom{
background:#444;
}

@media(max-width:500px){

main{
padding:8px;
}

h1{
font-size:20px;
}

button{
font-size:13px;
padding:10px 12px;
}

input{
width:130px;
}

}
</style>
</head>

<body>

<main>

<h1>📸 Mini LDR Studio V2</h1>

<p>Foto bersama dari 2 HP</p>


<!-- =========================
     PILIH ROOM
========================= -->

<div id="setup">

<button id="buatBtn">
BUAT ROOM
</button>

<br>

<input
id="kodeInput"
maxlength="6"
placeholder="KODE ROOM"
>

<button id="gabungBtn">
GABUNG
</button>

</div>


<!-- =========================
     INFO ROOM
========================= -->

<div id="roomInfo"></div>

<button
id="copyRoom"
class="hidden"
>
SALIN KODE
</button>


<div id="status">
Belum terhubung
</div>


<!-- =========================
     KAMERA
========================= -->

<div
id="cameras"
class="cameras hidden"
>

<div class="camera">

<video
id="localVideo"
autoplay
playsinline
muted
></video>

<div class="label">
KAMU
</div>

</div>


<div class="camera">

<video
id="remoteVideo"
autoplay
playsinline
></video>

<div class="label">
PASANGAN / TEMAN
</div>

</div>

</div>


<!-- =========================
     FOTO
========================= -->

<button
id="fotoBtn"
class="hidden"
>
📸 FOTO BERSAMA
</button>


<canvas
id="hasil"
class="hidden"
></canvas>


<a
id="download"
class="hidden"
download="mini-ldr-studio.jpg"
>
💾 SIMPAN FOTO
</a>

</main>


<div
id="countdown"
class="hidden"
>
3
</div>


<script>

/* ==================================================
   SUPABASE
================================================== */

const SUPABASE_URL =
"https://fdiurlgmbhzzoxtcnpmr.supabase.co";

const SUPABASE_KEY =
"sb_publishable_RVQ0mdl1PO17U_NanI-bGA_ZpoE4Zii";


const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* ==================================================
   VARIABLE
================================================== */

let role = null;

let roomCode = null;

let channel = null;

let localStream = null;

let peer = null;

let remoteStream = null;


/* ==================================================
   ELEMENT
================================================== */

const setup =
document.getElementById("setup");

const roomInfo =
document.getElementById("roomInfo");

const status =
document.getElementById("status");

const cameras =
document.getElementById("cameras");

const localVideo =
document.getElementById("localVideo");

const remoteVideo =
document.getElementById("remoteVideo");

const fotoBtn =
document.getElementById("fotoBtn");

const copyRoom =
document.getElementById("copyRoom");

const countdown =
document.getElementById("countdown");

const hasil =
document.getElementById("hasil");

const download =
document.getElementById("download");


/* ==================================================
   BUAT KODE 6 KARAKTER
================================================== */

function buatKode(){

const chars =
"ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

let kode = "";

for(let i=0;i<6;i++){

kode +=
chars[
Math.floor(
Math.random()*chars.length
)
];

}

return kode;

}


/* ==================================================
   BUAT ROOM
================================================== */

document
.getElementById("buatBtn")
.onclick =
async function(){

role = "host";

roomCode = buatKode();

await masukRoom();

};


/* ==================================================
   GABUNG ROOM
================================================== */

document
.getElementById("gabungBtn")
.onclick =
async function(){

const value =
document
.getElementById("kodeInput")
.value
.trim()
.toUpperCase();


if(value.length !== 6){

alert(
"Kode room harus 6 karakter."
);

return;

}


role = "guest";

roomCode = value;

await masukRoom();

};


/* ==================================================
   MASUK ROOM
================================================== */

async function masukRoom(){

setup.classList.add("hidden");


roomInfo.innerHTML =
"ROOM: <b>"+roomCode+"</b>";


copyRoom.classList.remove(
"hidden"
);


status.innerText =
"Meminta izin kamera...";


/* =========================
   KAMERA
========================= */

try{

localStream =
await navigator.mediaDevices
.getUserMedia({

video:{
facingMode:"user",
width:{ideal:720},
height:{ideal:1280}
},

audio:false

});


localVideo.srcObject =
localStream;


}catch(error){

console.error(error);

status.innerText =
"❌ Kamera gagal.";

alert(
"Izin kamera diperlukan. Pastikan website dibuka melalui HTTPS."
);

return;

}


cameras.classList.remove(
"hidden"
);


/* =========================
   WEBRTC
========================= */

buatPeer();


/* =========================
   SUPABASE CHANNEL
========================= */

channel =
supabaseClient.channel(
"mini-ldr-room-"+roomCode,
{
config:{
broadcast:{
self:false
}
}
});


channel.on(
"broadcast",
{
event:"signal"
},
async function(message){

const data =
message.payload;

console.log(
"Signal diterima:",
data
);

await prosesSignal(data);

});


/* =========================
   SUBSCRIBE
========================= */

channel.subscribe(
async function(state,error){

console.log(
"Supabase status:",
state,
error
);


if(state === "SUBSCRIBED"){

status.innerText =
"🟢 Room terhubung. Menunggu pasangan...";


/*
Kirim HELLO setelah
channel benar-benar aktif.
*/

await kirim({
type:"hello"
});


/*
Tombol foto hanya host.
*/

if(role === "host"){

fotoBtn.classList.remove(
"hidden"
);

}

}


else if(
state === "CHANNEL_ERROR"
){

status.innerText =
"❌ CHANNEL ERROR";

console.error(error);

}


else if(
state === "TIMED_OUT"
){

status.innerText =
"❌ Koneksi Supabase timeout";

}


else if(
state === "CLOSED"
){

status.innerText =
"Room ditutup.";

}

});

}


/* ==================================================
   COPY ROOM
================================================== */

copyRoom.onclick =
async function(){

try{

await navigator.clipboard.writeText(
roomCode
);

alert(
"Kode room berhasil disalin: "+
roomCode
);

}catch(e){

prompt(
"Salin kode ini:",
roomCode
);

}

};


/* ==================================================
   WEBRTC PEER
================================================== */

function buatPeer(){

peer =
new RTCPeerConnection({

iceServers:[

{
urls:
"stun:stun.l.google.com:19302"
},

{
urls:
"stun:stun1.l.google.com:19302"
}

]

});


remoteStream =
new MediaStream();


remoteVideo.srcObject =
remoteStream;


/* =========================
   TRACK KAMERA SENDIRI
========================= */

localStream
.getTracks()
.forEach(
function(track){

peer.addTrack(
track,
localStream
);

});


/* =========================
   TERIMA VIDEO TEMAN
========================= */

peer.ontrack =
function(event){

console.log(
"Remote video diterima"
);


if(
event.streams &&
event.streams[0]
){

event.streams[0]
.getTracks()
.forEach(
function(track){

if(
!remoteStream
.getTracks()
.includes(track)
){

remoteStream.addTrack(
track
);

}

});

}

};


/* =========================
   ICE
========================= */

peer.onicecandidate =
async function(event){

if(
event.candidate
){

await kirim({

type:"candidate",

candidate:
event.candidate

});

}

};


/* =========================
   STATUS
========================= */

peer.onconnectionstatechange =
function(){

const state =
peer.connectionState;


console.log(
"WebRTC:",
state
);


if(state === "connected"){

status.innerText =
"🟢 PASANGAN TERHUBUNG";

}


if(state === "connecting"){

status.innerText =
"🟡 Menghubungkan kamera...";

}


if(state === "disconnected"){

status.innerText =
"🟠 Koneksi terputus sementara";

}


if(state === "failed"){

status.innerText =
"🔴 WebRTC gagal terhubung";

}

};

}


/* ==================================================
   KIRIM SIGNAL
================================================== */

async function kirim(data){

if(!channel){

console.log(
"Channel belum tersedia"
);

return;

}


try{

await channel.send({

type:"broadcast",

event:"signal",

payload:data

});

}catch(error){

console.error(
"Gagal mengirim:",
error
);

}

}


/* ==================================================
   PROSES SIGNAL
================================================== */

async function prosesSignal(data){

try{


/* =========================
   HOST TERIMA HELLO
========================= */

if(
data.type === "hello" &&
role === "host"
){

console.log(
"Guest masuk room"
);


status.innerText =
"🟡 Pasangan ditemukan. Menghubungkan...";


const offer =
await peer.createOffer();


await peer.setLocalDescription(
offer
);


await kirim({

type:"offer",

sdp:
peer.localDescription

});

}


/* =========================
   GUEST TERIMA OFFER
========================= */

else if(
data.type === "offer" &&
role === "guest"
){

console.log(
"Offer diterima"
);


await peer.setRemoteDescription(
data.sdp
);


const answer =
await peer.createAnswer();


await peer.setLocalDescription(
answer
);


await kirim({

type:"answer",

sdp:
peer.localDescription

});

}


/* =========================
   HOST TERIMA ANSWER
========================= */

else if(
data.type === "answer" &&
role === "host"
){

console.log(
"Answer diterima"
);


await peer.setRemoteDescription(
data.sdp
);

}


/* =========================
   ICE CANDIDATE
========================= */

else if(
data.type === "candidate"
){

try{

await peer.addIceCandidate(
data.candidate
);

}catch(error){

console.log(
"ICE belum bisa ditambahkan"
);

}

}


/* =========================
   FOTO
========================= */

else if(
data.type === "photo" &&
role === "guest"
){

ambilFoto();

}

}catch(error){

console.error(
"Signal error:",
error
);

}

}


/* ==================================================
   FOTO BERSAMA
================================================== */

fotoBtn.onclick =
async function(){

if(role !== "host")
return;


/*
Beritahu HP pasangan.
*/

await kirim({

type:"photo"

});


/*
Host juga foto.
*/

ambilFoto();

};


/* ==================================================
   COUNTDOWN
================================================== */

async function ambilFoto(){

countdown
.classList
.remove("hidden");


for(
let i=3;
i>=1;
i--
){

countdown.innerText =
i;

await tunggu(700);

}


countdown.innerText =
"📸";

await tunggu(300);


countdown
.classList
.add("hidden");


buatFoto();

}


/* ==================================================
   TUNGGU
================================================== */

function tunggu(ms){

return new Promise(
function(resolve){

setTimeout(
resolve,
ms
);

});

}


/* ==================================================
   BUAT FOTO
================================================== */

function buatFoto(){

const W = 540;

const H = 960;


hasil.width =
W;

hasil.height =
H;


const ctx =
hasil.getContext("2d");


/* background */

ctx.fillStyle =
"#000";

ctx.fillRect(
0,
0,
W,
H
);


/*
Foto kiri.
*/

gambarVideo(
ctx,
localVideo,
0,
0,
W/2,
H
);


/*
Foto kanan.
*/

gambarVideo(
ctx,
remoteVideo,
W/2,
0,
W/2,
H
);


/*
Garis tengah.
*/

ctx.fillStyle =
"#fff";

ctx.fillRect(
W/2-1,
0,
2,
H
);


hasil.classList.remove(
"hidden"
);


/*
Buat link download.
*/

download.href =
hasil.toDataURL(
"image/jpeg",
0.92
);


download.classList.remove(
"hidden"
);

}


/* ==================================================
   GAMBAR VIDEO KE CANVAS
================================================== */

function gambarVideo(
ctx,
video,
x,
y,
w,
h
){

if(
!video ||
video.readyState < 2 ||
!video.videoWidth
){

ctx.fillStyle =
"#222";

ctx.fillRect(
x,
y,
w,
h
);

ctx.fillStyle =
"#aaa";

ctx.font =
"14px Arial";

ctx.textAlign =
"center";

ctx.fillText(
"Video belum siap",
x+w/2,
y+h/2
);

return;

}


const vw =
video.videoWidth;

const vh =
video.videoHeight;


/*
object-fit:cover
*/

const scale =
Math.max(
w/vw,
h/vh
);


const nw =
vw*scale;

const nh =
vh*scale;


const dx =
x+(w-nw)/2;

const dy =
y+(h-nh)/2;


ctx.save();


ctx.beginPath();

ctx.rect(
x,
y,
w,
h
);

ctx.clip();


ctx.drawImage(
video,
dx,
dy,
nw,
nh
);


ctx.restore();

}

</script>

</body>
</html>
