<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Mini LDR Studio V2</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#111;
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
}

.container{
  width:100%;
  max-width:900px;
  margin:auto;
  padding:15px;
}

h1{
  font-size:24px;
  margin:8px 0;
}

input{
  width:150px;
  padding:12px;
  border-radius:8px;
  border:0;
  text-align:center;
  font-size:16px;
  text-transform:uppercase;
}

button{
  padding:12px 16px;
  border:0;
  border-radius:8px;
  background:#e53935;
  color:white;
  font-weight:bold;
  margin:5px;
}

button:active{
  transform:scale(.96);
}

#status{
  margin:12px 0;
  color:#8cff8c;
}

#roomInfo{
  font-weight:bold;
  margin:8px;
}

/* SELALU 2 KOLOM */
.cameras{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  width:100%;
}

.camera{
  position:relative;
  width:100%;
  aspect-ratio:9/16;
  background:#222;
  border-radius:12px;
  overflow:hidden;
}

.camera video{
  width:100%;
  height:100%;
  object-fit:cover;
}

.label{
  position:absolute;
  top:8px;
  left:8px;
  background:#000b;
  padding:5px 9px;
  border-radius:7px;
  font-size:12px;
}

.hidden{
  display:none!important;
}

#countdown{
  position:fixed;
  inset:0;
  background:#000b;
  z-index:99;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:100px;
  font-weight:bold;
}

#result{
  width:100%;
  max-width:540px;
  margin-top:15px;
  border-radius:10px;
}

#download{
  display:inline-block;
  margin-top:10px;
  padding:12px 18px;
  background:#16a34a;
  color:white;
  border-radius:8px;
  text-decoration:none;
  font-weight:bold;
}

@media(max-width:500px){
  .container{
    padding:8px;
  }

  h1{
    font-size:20px;
  }

  input{
    width:135px;
  }

  button{
    padding:10px 12px;
    font-size:13px;
  }
}
</style>
</head>

<body>

<div class="container">

<h1>📸 Mini LDR Studio V2</h1>

<p>Foto bersama dari 2 HP</p>

<div id="setup">

  <button onclick="buatRoom()">
    BUAT ROOM
  </button>

  <br>

  <input
    id="kodeRoom"
    maxlength="6"
    placeholder="KODE ROOM"
  >

  <button onclick="gabungRoom()">
    GABUNG
  </button>

</div>

<div id="roomInfo"></div>

<div id="status">
  Belum terhubung
</div>

<div
  id="cameras"
  class="cameras hidden"
>

  <div class="camera">

    <video
      id="videoLocal"
      autoplay
      muted
      playsinline
    ></video>

    <div class="label">
      KAMU
    </div>

  </div>

  <div class="camera">

    <video
      id="videoRemote"
      autoplay
      playsinline
    ></video>

    <div class="label">
      PASANGAN / TEMAN
    </div>

  </div>

</div>

<br>

<button
  id="fotoBtn"
  class="hidden"
  onclick="fotoBersama()"
>
  📸 FOTO BERSAMA
</button>

<canvas
  id="hasil"
  class="hidden"
></canvas>

<br>

<a
  id="download"
  class="hidden"
  download="mini-ldr-studio.jpg"
>
  💾 SIMPAN FOTO
</a>

</div>


<div
  id="countdown"
  class="hidden"
>
  3
</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://fdiurlgmbhzzoxtcnpmr.supabase.co";

const SUPABASE_KEY =
"sb_publishable_RVQ0mdl1PO17U_NanI-bGA_ZpoE4Zii";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================
   VARIABLE
========================= */

let role = "";

let roomCode = "";

let channel = null;

let localStream = null;

let peer = null;

let remoteStream = null;


/* =========================
   ELEMENT
========================= */

const videoLocal =
document.getElementById("videoLocal");

const videoRemote =
document.getElementById("videoRemote");

const cameras =
document.getElementById("cameras");

const status =
document.getElementById("status");

const roomInfo =
document.getElementById("roomInfo");

const fotoBtn =
document.getElementById("fotoBtn");

const countdown =
document.getElementById("countdown");

const canvas =
document.getElementById("hasil");

const download =
document.getElementById("download");


/* =========================
   BUAT KODE ROOM
========================= */

function kodeAcak(){

  const karakter =
  "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

  let hasil = "";

  for(let i=0;i<6;i++){

    hasil += karakter[
      Math.floor(
        Math.random()*karakter.length
      )
    ];

  }

  return hasil;
}


/* =========================
   BUAT ROOM
========================= */

async function buatRoom(){

  roomCode = kodeAcak();

  role = "host";

  await mulaiRoom();

}


/* =========================
   GABUNG ROOM
========================= */

async function gabungRoom(){

  const input =
  document.getElementById("kodeRoom");

  roomCode =
  input.value
  .trim()
  .toUpperCase();

  if(roomCode.length !== 6){

    alert(
      "Masukkan kode room 6 karakter."
    );

    return;
  }

  role = "guest";

  await mulaiRoom();

}


/* =========================
   MULAI ROOM
========================= */

async function mulaiRoom(){

  document
  .getElementById("setup")
  .classList.add("hidden");

  roomInfo.innerHTML =
  "ROOM: <b>"+roomCode+"</b>";

  status.innerText =
  "Meminta izin kamera...";

  try{

    localStream =
    await navigator.mediaDevices
    .getUserMedia({

      video:{
        facingMode:"user"
      },

      audio:false

    });

    videoLocal.srcObject =
    localStream;

  }catch(error){

    status.innerText =
    "❌ Kamera tidak bisa digunakan.";

    alert(
      "Izin kamera diperlukan untuk menggunakan Mini LDR Studio."
    );

    return;
  }


  cameras.classList.remove(
    "hidden"
  );


  buatPeer();


  channel =
  supabaseClient.channel(
    "mini-ldr-"+roomCode,
    {
      config:{
        broadcast:{
          self:false
        }
      }
    }
  );


  channel.on(
    "broadcast",
    {
      event:"signal"
    },
    async payload => {

      const data =
      payload.payload;

      await prosesSignal(data);

    }
  );


  const result =
  await channel.subscribe();


  if(result !== "SUBSCRIBED"){

    status.innerText =
    "❌ Gagal terhubung ke room.";

    return;

  }


  status.innerText =
  "🟢 Room aktif. Menunggu pasangan...";


  await kirim({
    type:"hello"
  });


  if(role === "host"){

    fotoBtn.classList.remove(
      "hidden"
    );

  }

}


/* =========================
   WEBRTC
========================= */

function buatPeer(){

  peer =
  new RTCPeerConnection({

    iceServers:[
      {
        urls:
        "stun:stun.l.google.com:19302"
      }
    ]

  });


  remoteStream =
  new MediaStream();

  videoRemote.srcObject =
  remoteStream;


  localStream
  .getTracks()
  .forEach(track => {

    peer.addTrack(
      track,
      localStream
    );

  });


  peer.ontrack =
  event => {

    event.streams[0]
    .getTracks()
    .forEach(track => {

      remoteStream.addTrack(
        track
      );

    });

  };


  peer.onicecandidate =
  async event => {

    if(event.candidate){

      await kirim({

        type:"candidate",

        candidate:
        event.candidate

      });

    }

  };


  peer.onconnectionstatechange =
  () => {

    const state =
    peer.connectionState;

    if(state === "connected"){

      status.innerText =
      "🟢 PASANGAN TERHUBUNG";

    }

    else if(
      state === "disconnected" ||
      state === "failed"
    ){

      status.innerText =
      "🔴 Koneksi terputus";

    }

  };

}


/* =========================
   KIRIM SIGNAL
========================= */

async function kirim(data){

  if(!channel) return;

  await channel.send({

    type:"broadcast",

    event:"signal",

    payload:data

  });

}


/* =========================
   PROSES SIGNAL
========================= */

async function prosesSignal(data){

  try{

    /* HOST MENERIMA TAMU */

    if(
      data.type === "hello" &&
      role === "host"
    ){

      const offer =
      await peer.createOffer();

      await peer.setLocalDescription(
        offer
      );

      await kirim({

        type:"offer",

        sdp:
        peer.localDescription

      });

    }


    /* GUEST MENERIMA OFFER */

    else if(
      data.type === "offer" &&
      role === "guest"
    ){

      await peer.setRemoteDescription(
        data.sdp
      );


      const answer =
      await peer.createAnswer();

      await peer.setLocalDescription(
        answer
      );


      await kirim({

        type:"answer",

        sdp:
        peer.localDescription

      });

    }


    /* HOST MENERIMA ANSWER */

    else if(
      data.type === "answer" &&
      role === "host"
    ){

      await peer.setRemoteDescription(
        data.sdp
      );

    }


    /* ICE */

    else if(
      data.type === "candidate"
    ){

      try{

        await peer.addIceCandidate(
          data.candidate
        );

      }catch(e){}

    }


    /* FOTO */

    else if(
      data.type === "photo" &&
      role === "guest"
    ){

      ambilFoto();

    }

  }catch(error){

    console.error(error);

  }

}


/* =========================
   FOTO BERSAMA
========================= */

async function fotoBersama(){

  if(role !== "host") return;


  await kirim({

    type:"photo"

  });


  ambilFoto();

}


/* =========================
   COUNTDOWN
========================= */

async function ambilFoto(){

  countdown.classList.remove(
    "hidden"
  );


  for(
    let i=3;
    i>=1;
    i--
  ){

    countdown.innerText =
    i;

    await new Promise(
      resolve =>
      setTimeout(resolve,700)
    );

  }


  countdown.innerText =
  "📸";


  await new Promise(
    resolve =>
    setTimeout(resolve,300)
  );


  countdown.classList.add(
    "hidden"
  );


  buatHasil();

}


/* =========================
   BUAT HASIL
========================= */

function buatHasil(){

  /*
    Hasil akhir 9:16.
    Dua video ditempatkan
    berdampingan.
  */

  const width = 540;

  const height = 960;

  canvas.width =
  width;

  canvas.height =
  height;


  const ctx =
  canvas.getContext("2d");


  ctx.fillStyle =
  "#000";

  ctx.fillRect(
    0,
    0,
    width,
    height
  );


  gambarVideo(
    ctx,
    videoLocal,
    0,
    0,
    width/2,
    height
  );


  gambarVideo(
    ctx,
    videoRemote,
    width/2,
    0,
    width/2,
    height
  );


  /* GARIS TENGAH */

  ctx.fillStyle =
  "#fff";

  ctx.fillRect(
    width/2-1,
    0,
    2,
    height
  );


  canvas.classList.remove(
    "hidden"
  );


  download.href =
  canvas.toDataURL(
    "image/jpeg",
    0.92
  );


  download.classList.remove(
    "hidden"
  );

}


/* =========================
   GAMBAR VIDEO
========================= */

function gambarVideo(
  ctx,
  video,
  x,
  y,
  w,
  h
){

  if(
    !video ||
    video.readyState < 2
  ){

    ctx.fillStyle =
    "#222";

    ctx.fillRect(
      x,
      y,
      w,
      h
    );

    return;

  }


  const vw =
  video.videoWidth;

  const vh =
  video.videoHeight;


  const scale =
  Math.max(
    w/vw,
    h/vh
  );


  const nw =
  vw*scale;

  const nh =
  vh*scale;


  const dx =
  x+(w-nw)/2;

  const dy =
  y+(h-nh)/2;


  ctx.save();

  ctx.beginPath();

  ctx.rect(
    x,
    y,
    w,
    h
  );

  ctx.clip();


  ctx.drawImage(
    video,
    dx,
    dy,
    nw,
    nh
  );


  ctx.restore();

}

</script>

</body>
</html>
