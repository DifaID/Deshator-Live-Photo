<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mini LDR Studio V4</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#080808;
color:#fff;
font-family:Arial,sans-serif;
text-align:center;
}

main{
max-width:900px;
margin:auto;
padding:10px;
}

h1{font-size:22px;margin:7px 0}
p{color:#bbb;margin:5px}

button,input{
border:0;
border-radius:9px;
padding:11px 13px;
font-size:14px;
}

button{
background:#e53935;
color:white;
font-weight:bold;
margin:4px;
}

button:active{transform:scale(.96)}

input{text-align:center}

#kodeInput{
width:140px;
text-transform:uppercase;
}

#status{
margin:9px;
color:#79ff79;
font-size:13px;
}

#roomInfo{
margin:8px;
font-size:16px;
}

.hidden{display:none!important}


/* KAMERA */

.cameras{
display:grid;
grid-template-columns:1fr 1fr;
gap:5px;
}

.camera{
position:relative;
width:100%;
aspect-ratio:9/16;
background:#000;
overflow:hidden;
border-radius:10px;
}

.camera video{
width:100%;
height:100%;
object-fit:cover;
background:#000;
transform:none!important;
}

.label{
position:absolute;
top:7px;
left:7px;
z-index:5;
background:#000b;
padding:5px 8px;
border-radius:6px;
font-size:11px;
}


/* KONTROL */

.controls{margin-top:8px}

#fotoBtn{
font-size:16px;
padding:13px 22px;
}

#copyRoom{background:#333}


/* EFEK */

.effects{
display:flex;
gap:5px;
overflow-x:auto;
padding:8px 2px;
margin-top:5px;
}

.effects button{
white-space:nowrap;
background:#252525;
font-size:12px;
}

.effects button.active{
background:#e53935;
}

#effectName{
font-size:12px;
color:#aaa;
}


/* AI */

.ai{
background:#151515;
border-radius:10px;
padding:10px;
margin-top:10px;
text-align:left;
}

.ai h3{
margin:2px 0 7px;
font-size:15px;
}

#aiPrompt{
width:100%;
text-align:left;
background:#222;
color:white;
outline:none;
}

#aiPrompt::placeholder{color:#777}

#aiPreview{
margin-top:7px;
color:#aaa;
font-size:12px;
line-height:1.4;
}


/* HASIL */

#hasil{
display:block;
width:100%;
max-width:540px;
margin:12px auto;
border-radius:10px;
}

#download{
display:inline-block;
background:#16a34a;
color:white;
padding:12px 18px;
border-radius:9px;
text-decoration:none;
font-weight:bold;
}


/* COUNTDOWN */

#countdown{
position:fixed;
inset:0;
background:#000c;
z-index:999;
display:flex;
align-items:center;
justify-content:center;
font-size:100px;
font-weight:bold;
}


/* FILTER */

.fx-normal{filter:none}
.fx-vivid{filter:saturate(1.5) contrast(1.08)}
.fx-warm{filter:sepia(.22) saturate(1.35) brightness(1.04)}
.fx-cool{filter:saturate(.9) hue-rotate(12deg) brightness(1.04)}
.fx-cinema{filter:contrast(1.25) saturate(.8) brightness(.9)}
.fx-vintage{filter:sepia(.45) contrast(1.05) saturate(.75)}
.fx-bw{filter:grayscale(1) contrast(1.15)}
.fx-fade{filter:contrast(.9) brightness(1.08) saturate(.65)}
.fx-dream{filter:brightness(1.08) saturate(1.25) blur(.15px)}
.fx-night{filter:brightness(.72) contrast(1.25) saturate(1.2)}
.fx-sunset{filter:sepia(.3) saturate(1.6) hue-rotate(-8deg)}
.fx-rose{filter:sepia(.12) saturate(1.35) hue-rotate(-12deg)}
.fx-moon{filter:grayscale(.3) brightness(.9) contrast(1.25)}
.fx-dramatic{filter:contrast(1.45) saturate(1.15) brightness(.88)}


/* MOBILE */

@media(max-width:500px){
main{padding:7px}
h1{font-size:19px}
button{font-size:12px;padding:10px 11px}
}
</style>
</head>

<body>

<main>

<h1>📸 Mini LDR Studio</h1>
<p>Studio foto jarak jauh • 2 HP</p>

<div id="setup">

<button id="buatBtn">BUAT ROOM</button>

<br>

<input
id="kodeInput"
maxlength="6"
placeholder="KODE ROOM"
>

<button id="gabungBtn">GABUNG</button>

</div>

<div id="roomInfo"></div>

<button id="copyRoom" class="hidden">
SALIN KODE
</button>

<div id="status">
Belum terhubung
</div>


<!-- KAMERA -->

<div id="cameras" class="cameras hidden">

<div class="camera">

<video
id="localVideo"
autoplay
playsinline
muted
></video>

<div class="label">KAMU</div>

</div>

<div class="camera">

<video
id="remoteVideo"
autoplay
playsinline
></video>

<div class="label">PASANGAN</div>

</div>

</div>


<!-- EFEK -->

<div id="effectArea" class="hidden">

<div id="effectName">
Efek: Normal
</div>

<div class="effects">

<button data-fx="fx-normal">Normal</button>
<button data-fx="fx-vivid">Vivid</button>
<button data-fx="fx-warm">Warm</button>
<button data-fx="fx-cool">Cool</button>
<button data-fx="fx-cinema">Cinema</button>
<button data-fx="fx-vintage">Vintage</button>
<button data-fx="fx-bw">B&W</button>
<button data-fx="fx-fade">Fade</button>
<button data-fx="fx-dream">Dream</button>
<button data-fx="fx-night">Night</button>
<button data-fx="fx-sunset">Sunset</button>
<button data-fx="fx-rose">Rose</button>
<button data-fx="fx-moon">Moon</button>
<button data-fx="fx-dramatic">Dramatic</button>

</div>

</div>


<!-- FOTO -->

<div class="controls">

<button id="fotoBtn" class="hidden">
📸 FOTO BERSAMA
</button>

</div>


<!-- AI -->

<div id="aiArea" class="ai hidden">

<h3>🤖 Prompt AI Background</h3>

<input
id="aiPrompt"
placeholder="Contoh: rooftop kota Jakarta saat sunset, cinematic..."
>

<button id="aiBtn">
✨ TERAPKAN PROMPT
</button>

<div id="aiPreview">
Prompt belum digunakan.
</div>

</div>


<!-- HASIL -->

<canvas id="hasil" class="hidden"></canvas>

<a
id="download"
class="hidden"
download="mini-ldr-studio.jpg"
>
💾 SIMPAN FOTO
</a>

</main>


<div id="countdown" class="hidden">
3
</div>


<script>

/* ==================================================
   SUPABASE
================================================== */

const SUPABASE_URL=
"https://fdiurlgmbhzzoxtcnpmr.supabase.co";

const SUPABASE_KEY=
"sb_publishable_RVQ0mdl1PO17U_NanI-bGA_ZpoE4Zii";

const supabaseClient=
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* ==================================================
   VARIABLE
================================================== */

let role=null;
let roomCode=null;
let channel=null;
let localStream=null;
let peer=null;
let remoteStream=null;

let currentEffect="fx-normal";
let currentPrompt="";

let capturing=false;
let pendingCandidates=[];


/* ==================================================
   ELEMENT
================================================== */

const setup=
document.getElementById("setup");

const roomInfo=
document.getElementById("roomInfo");

const status=
document.getElementById("status");

const cameras=
document.getElementById("cameras");

const localVideo=
document.getElementById("localVideo");

const remoteVideo=
document.getElementById("remoteVideo");

const fotoBtn=
document.getElementById("fotoBtn");

const copyRoom=
document.getElementById("copyRoom");

const countdown=
document.getElementById("countdown");

const hasil=
document.getElementById("hasil");

const download=
document.getElementById("download");

const effectArea=
document.getElementById("effectArea");

const aiArea=
document.getElementById("aiArea");

const effectName=
document.getElementById("effectName");

const aiPrompt=
document.getElementById("aiPrompt");

const aiPreview=
document.getElementById("aiPreview");


/* ==================================================
   KODE ROOM
================================================== */

function buatKode(){

const chars=
"ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

let kode="";

for(let i=0;i<6;i++){

kode+=chars[
Math.floor(
Math.random()*chars.length
)
];

}

return kode;

}


/* ==================================================
   BUAT ROOM
================================================== */

document.getElementById("buatBtn").onclick=
async function(){

role="host";
roomCode=buatKode();

await masukRoom();

};


/* ==================================================
   GABUNG ROOM
================================================== */

document.getElementById("gabungBtn").onclick=
async function(){

const kode=
document
.getElementById("kodeInput")
.value
.trim()
.toUpperCase();

if(kode.length!==6){

alert("Kode room harus 6 karakter.");
return;

}

role="guest";
roomCode=kode;

await masukRoom();

};


/* ==================================================
   MASUK ROOM
================================================== */

async function masukRoom(){

setup.classList.add("hidden");

roomInfo.innerHTML=
"ROOM: <b>"+roomCode+"</b>";

copyRoom.classList.remove("hidden");

status.innerText=
"Meminta izin kamera...";


try{

localStream=
await navigator.mediaDevices.getUserMedia({

video:{
facingMode:{
ideal:"user"
},
width:{
ideal:1080
},
height:{
ideal:1920
},
aspectRatio:{
ideal:9/16
}
},

audio:false

});


/*
 Kamera depan.
 Tidak mirror.
*/

localVideo.srcObject=
localStream;

localVideo.style.transform=
"none";

}catch(error){

console.error(error);

status.innerText=
"❌ Kamera gagal.";

alert(
"Izin kamera diperlukan. Pastikan website memakai HTTPS."
);

return;

}


cameras.classList.remove("hidden");
effectArea.classList.remove("hidden");
aiArea.classList.remove("hidden");


/* WEBRTC */

buatPeer();


/* SUPABASE */

channel=
supabaseClient.channel(
"mini-ldr-room-"+roomCode,
{
config:{
broadcast:{
self:false
}
}
});


channel.on(
"broadcast",
{
event:"signal"
},
async function(message){

await prosesSignal(
message.payload
);

});


channel.subscribe(
async function(state,error){

console.log(
"Supabase:",
state,
error
);

if(state==="SUBSCRIBED"){

status.innerText=
"🟢 Room terhubung. Menunggu pasangan...";

await kirim({
type:"hello"
});

fotoBtn.classList.remove("hidden");

}

else if(state==="CHANNEL_ERROR"){

status.innerText=
"❌ CHANNEL ERROR";

console.error(error);

}

else if(state==="TIMED_OUT"){

status.innerText=
"❌ Supabase timeout";

}

});

}


/* ==================================================
   COPY ROOM
================================================== */

copyRoom.onclick=
async function(){

try{

await navigator.clipboard.writeText(roomCode);

alert(
"Kode room:\n"+roomCode
);

}catch(e){

prompt(
"Salin kode:",
roomCode
);

}

};


/* ==================================================
   WEBRTC
================================================== */

function buatPeer(){

peer=
new RTCPeerConnection({

iceServers:[

{
urls:"stun:stun.l.google.com:19302"
},

{
urls:"stun:stun1.l.google.com:19302"
}

]

});


remoteStream=
new MediaStream();

remoteVideo.srcObject=
remoteStream;


/* LOCAL TRACK */

localStream
.getTracks()
.forEach(track=>{

peer.addTrack(
track,
localStream
);

});


/* REMOTE TRACK */

peer.ontrack=
event=>{

const streams=
event.streams;

if(streams && streams[0]){

streams[0]
.getTracks()
.forEach(track=>{

if(
!remoteStream
.getTracks()
.includes(track)
){

remoteStream.addTrack(track);

}

});

}

};


/* ICE */

peer.onicecandidate=
async event=>{

if(event.candidate){

await kirim({

type:"candidate",
candidate:event.candidate

});

}

};


/* STATUS */

peer.onconnectionstatechange=
()=>{

const state=
peer.connectionState;

if(state==="connected"){

status.innerText=
"🟢 PASANGAN TERHUBUNG";

}

else if(state==="connecting"){

status.innerText=
"🟡 Menghubungkan kamera...";

}

else if(state==="disconnected"){

status.innerText=
"🟠 Koneksi terputus";

}

else if(state==="failed"){

status.innerText=
"🔴 WebRTC gagal";

}

};

}


/* ==================================================
   KIRIM
================================================== */

async function kirim(data){

if(!channel)return;

try{

await channel.send({

type:"broadcast",
event:"signal",
payload:data

});

}catch(error){

console.error(error);

}

}


/* ==================================================
   SIGNAL
================================================== */

async function prosesSignal(data){

try{


/* HOST MENERIMA HELLO */

if(
data.type==="hello" &&
role==="host"
){

const offer=
await peer.createOffer();

await peer.setLocalDescription(
offer
);

await kirim({

type:"offer",
sdp:peer.localDescription

});

}


/* GUEST MENERIMA OFFER */

else if(
data.type==="offer" &&
role==="guest"
){

await peer.setRemoteDescription(
data.sdp
);


/*
 Masukkan ICE yang datang
 sebelum remote description siap.
*/

for(
const candidate of pendingCandidates
){

try{

await peer.addIceCandidate(
candidate
);

}catch(e){}

}

pendingCandidates=[];


const answer=
await peer.createAnswer();

await peer.setLocalDescription(
answer
);

await kirim({

type:"answer",
sdp:peer.localDescription

});

}


/* HOST MENERIMA ANSWER */

else if(
data.type==="answer" &&
role==="host"
){

await peer.setRemoteDescription(
data.sdp
);


/*
 Masukkan candidate yang
 sempat menunggu.
*/

for(
const candidate of pendingCandidates
){

try{

await peer.addIceCandidate(
candidate
);

}catch(e){}

}

pendingCandidates=[];

}


/* ICE */

else if(
data.type==="candidate"
){

if(
peer.remoteDescription &&
peer.remoteDescription.type
){

try{

await peer.addIceCandidate(
data.candidate
);

}catch(e){

console.warn(
"ICE gagal:",
e
);

}

}else{

pendingCandidates.push(
data.candidate
);

}

}


/* FOTO */

else if(
data.type==="photo"
){

ambilFoto();

}

}catch(error){

console.error(
"Signal:",
error
);

}

}


/* ==================================================
   FOTO
================================================== */

fotoBtn.onclick=
async function(){

if(capturing)return;

capturing=true;

await kirim({
type:"photo"
});

await ambilFoto();

capturing=false;

};


/* ==================================================
   COUNTDOWN
================================================== */

async function ambilFoto(){

if(
!localVideo.videoWidth
){

return;

}

countdown.classList.remove(
"hidden"
);

for(
let i=3;
i>=1;
i--
){

countdown.innerText=i;

await tunggu(700);

}

countdown.innerText="📸";

await tunggu(300);

countdown.classList.add(
"hidden"
);

buatFoto();

}


/* ==================================================
   TIMER
================================================== */

function tunggu(ms){

return new Promise(
resolve=>
setTimeout(resolve,ms)
);

}


/* ==================================================
   EFEK
================================================== */

document
.querySelectorAll(".effects button")
.forEach(button=>{

button.onclick=()=>{

currentEffect=
button.dataset.fx;

localVideo.className=
currentEffect;

remoteVideo.className=
currentEffect;

document
.querySelectorAll(".effects button")
.forEach(b=>
b.classList.remove("active")
);

button.classList.add("active");

effectName.innerText=
"Efek: "+
button.innerText;

};

});


/* ==================================================
   AI PROMPT
================================================== */

document.getElementById("aiBtn").onclick=
function(){

currentPrompt=
aiPrompt.value.trim();

if(!currentPrompt){

aiPreview.innerText=
"Masukkan prompt AI dulu.";

return;

}

aiPreview.innerHTML=
"🤖 Konsep AI aktif:<br><b>"+
escapeHTML(currentPrompt)+
"</b>";

};


/* ==================================================
   ESCAPE
================================================== */

function escapeHTML(text){

return text
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* ==================================================
   BUAT FOTO
================================================== */

function buatFoto(){

const W=540;
const H=960;

hasil.width=W;
hasil.height=H;

const ctx=
hasil.getContext("2d");

ctx.fillStyle="#000";

ctx.fillRect(
0,
0,
W,
H
);


/*
 Kamera kiri
*/

gambarVideo(
ctx,
localVideo,
0,
0,
W/2,
H
);


/*
 Kamera kanan
*/

gambarVideo(
ctx,
remoteVideo,
W/2,
0,
W/2,
H
);


/*
 Garis tengah
*/

ctx.fillStyle="#fff";

ctx.fillRect(
W/2-1,
0,
2,
H
);


/*
 Prompt AI
*/

if(currentPrompt){

ctx.fillStyle=
"rgba(0,0,0,.55)";

ctx.fillRect(
0,
H-48,
W,
48
);

ctx.fillStyle="#fff";

ctx.font="11px Arial";

ctx.textAlign="center";

ctx.fillText(
"AI: "+
currentPrompt.slice(0,80),
W/2,
H-20
);

}


hasil.classList.remove(
"hidden"
);

download.href=
hasil.toDataURL(
"image/jpeg",
0.92
);

download.classList.remove(
"hidden"
);

}


/* ==================================================
   GAMBAR VIDEO
================================================== */

function gambarVideo(
ctx,
video,
x,
y,
w,
h
){

if(
!video ||
video.readyState<2 ||
!video.videoWidth
){

ctx.fillStyle="#222";

ctx.fillRect(
x,
y,
w,
h
);

ctx.fillStyle="#aaa";

ctx.font="13px Arial";

ctx.textAlign="center";

ctx.fillText(
"Video belum siap",
x+w/2,
y+h/2
);

return;

}


const vw=
video.videoWidth;

const vh=
video.videoHeight;


/*
 COVER
*/

const scale=
Math.max(
w/vw,
h/vh
);

const nw=
vw*scale;

const nh=
vh*scale;

const dx=
x+(w-nw)/2;

const dy=
y+(h-nh)/2;


ctx.save();

ctx.beginPath();

ctx.rect(
x,
y,
w,
h
);

ctx.clip();


/*
 Efek ikut masuk
 ke hasil foto.
*/

ctx.filter=
getComputedStyle(video)
.filter;


/*
 Tidak mirror.
*/

ctx.drawImage(
video,
dx,
dy,
nw,
nh
);

ctx.restore();

ctx.filter="none";

}

</script>

</body>
</html>
